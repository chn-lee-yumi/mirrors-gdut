# 回源教育网 MirrorZ（固定 https，与客户端访问我方使用的协议无关；
# nginx 侧持有系统 CA，无证书问题）
proxy_pass  https://mirrorz;
proxy_set_header Host "mirrors.cernet.edu.cn";
proxy_ssl_server_name on;
# MirrorZ 会 302 到具体镜像站（sysu/sustech/ustc...）。
# 拦截该跳转并由 nginx 内部跟随取回内容，不透传给客户端：
# 否则跳转目标的协议跟随回源协议而非客户端协议，
# 无 CA 环境走 https 校验失败、apt 从 https 降级 http 时直接拒绝。
# 拦截在这里启用；error_page 跟随目标（含缓存 TTL 选择）由各源的
# cache_30d.conf / cache_2h.conf 定义。
proxy_intercept_errors on;
