proxy_cache_key $uri;
proxy_cache_revalidate on;
proxy_cache_lock on;
proxy_cache_valid 200 30d;
# 注意：不能用 proxy_cache_valid any——它会把 301/302 也写进缓存。
# 缓存命中的 302 不会填充 $upstream_http_location，导致上方 error_page
# 的 ?to= 为空，跟随 location 只能返回 502（且 revalidate 遇上游 304
# 会不断续期，脏条目永不过期）。只缓存明确的错误码。
proxy_cache_valid 404 12h;
proxy_cache_valid 500 502 503 504 12h;
add_header mirror-cache "$upstream_cache_status";
# MirrorZ 302 跟随：拦截上游跳转，nginx 内部去目标镜像站取回内容。
# $upstream_http_location 在 error_page 目标 URI 求值时仍有效，
# 经查询参数桥接到跟随 location（30d 版缓存）。
# 仅对配置了 proxy_intercept_errors 的 MirrorZ 源生效。
error_page 301 302 307 308 = /@mirrorz-follow-30d?to=$upstream_http_location;
